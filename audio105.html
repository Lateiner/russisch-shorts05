<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Audio-Quiz: Intonation</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .audio-box {
            margin: 25px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid var(--accent);
        }

        .play-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }

        .play-btn:active { transform: scale(0.98); }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        #feedback {
            margin-top: 20px;
            min-height: 50px;
            font-weight: 500;
        }

        .nav-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        .progress { margin-bottom: 15px; color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div class="progress" id="progress">Satz 1 von 6</div>
        <h2>Hör genau hin!</h2>
        <p>Klicke auf den Button, um den russischen Satz (männliche Stimme) zu hören.</p>

        <div class="audio-box">
            <button class="play-btn" onclick="speakCurrentSentence()">🔊 Satz anhören</button>
        </div>

        <div class="options" id="options">
            <button class="option-btn" onclick="checkAnswer(false)">Sachliche Information (Fakt)</button>
            <button class="option-btn" onclick="checkAnswer(true)">Vermutung (Meinung)</button>
        </div>

        <div id="feedback"></div>
        <button id="next-btn" class="nav-btn" onclick="nextQuestion()">Nächster Satz</button>
        <button id="restart-btn" class="nav-btn" onclick="resetQuiz()" style="background:#95a5a6">Neustarten</button>
    </div>

    <script>
        const quizData = [
            { text: "Он не работает.", isGuess: false, info: "Neutraler Fakt: Er arbeitet nicht." },
            { text: "Что, не работает?", isGuess: true, info: "Vermutung: Arbeitet er etwa nicht?" },
            { text: "На улице холодно.", isGuess: false, info: "Fakt: Es ist draußen kalt." },
            { text: "Что, холодно?", isGuess: true, info: "Vermutung: Ist dir etwa kalt?" },
            { text: "Что, устал?", isGuess: true, info: "Vermutung: Bist du etwa müde?" },
            { text: "Я иду домой.", isGuess: false, info: "Fakt: Ich gehe nach Hause." }
        ];

        let currentIdx = 0;

        function speakCurrentSentence() {
            const msg = new SpeechSynthesisUtterance();
            msg.text = quizData[currentIdx].text;
            msg.lang = 'ru-RU'; // Russisch
            
            // Suche nach einer männlichen Stimme
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.lang.startsWith('ru') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('dmitry') || v.name.toLowerCase().includes('pavel')));
            
            if (maleVoice) msg.voice = maleVoice;
            
            // Intonation für Vermutungen leicht anpassen (Pitch)
            if (quizData[currentIdx].isGuess) {
                msg.pitch = 1.3; // Etwas höher für Fragen/Vermutungen
                msg.rate = 0.9;  // Etwas langsamer
            } else {
                msg.pitch = 1.0;
                msg.rate = 1.0;
            }

            window.speechSynthesis.speak(msg);
        }

        // Stimmen laden (wichtig für Chrome)
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        function checkAnswer(userChoice) {
            const current = quizData[currentIdx];
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => btn.disabled = true);

            if (userChoice === current.isGuess) {
                feedback.innerHTML = `<span style="color:var(--success)">Richtig! ✓</span><br><small>${current.info}</small>`;
            } else {
                feedback.innerHTML = `<span style="color:var(--error)">Nicht ganz. ✗</span><br><small>${current.info}</small>`;
            }

            document.getElementById('next-btn').style.display = "inline-block";
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                document.getElementById('progress').textContent = `Satz ${currentIdx + 1} von ${quizData.length}`;
                document.getElementById('feedback').innerHTML = "";
                document.getElementById('next-btn').style.display = "none";
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => btn.disabled = false);
            } else {
                showFinal();
            }
        }

        function showFinal() {
            document.querySelector('.audio-box').style.display = "none";
            document.getElementById('options').style.display = "none";
            document.getElementById('feedback').innerHTML = "<b>Quiz beendet!</b><br>Du hast ein besseres Gespür für die russische Intonation bekommen.";
            document.getElementById('restart-btn').style.display = "inline-block";
            document.getElementById('next-btn').style.display = "none";
        }

        function resetQuiz() {
            currentIdx = 0;
            document.querySelector('.audio-box').style.display = "block";
            document.getElementById('options').style.display = "grid";
            document.getElementById('restart-btn').style.display = "none";
            initPuzzle(); // Dummy Aufruf
            location.reload(); // Einfachste Art den State zu resetten
        }
    </script>
</body>
</html>
