<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Memory: Nuancen & Situationen</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }

        body { 
            font-family: Arial, Helvetica, sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }
        
        .header { text-align: center; margin-bottom: 20px; max-width: 600px; }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }

        @media (min-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .card {
            width: 100%;
            min-height: 120px; /* Feste Mindesthöhe für bessere Lesbarkeit */
            aspect-ratio: 1 / 1;
            background: var(--primary);
            color: transparent; /* Text versteckt, wenn nicht umgedreht */
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Text fängt links an */
            text-align: left; /* Linksbündiger Text */
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.4;
            transition: transform 0.4s, background 0.4s, opacity 1s;
            user-select: none;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
            overflow-wrap: break-word; /* Verhindert Überlaufen bei langen Wörtern */
        }

        .card.flipped {
            background: white;
            color: var(--primary);
            border: 3px solid var(--accent);
            transform: rotateY(0deg); /* Keine Spiegelung des Textes */
        }

        /* Gefundene Paare verschwinden langsam */
        .card.matched {
            background: var(--success);
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-out;
        }

        #feedback { 
            margin-top: 20px; 
            font-weight: bold; 
            height: 30px; 
            font-size: 1.2rem;
            color: var(--primary); 
        }

        .controls { margin-top: 20px; }
        
        .btn-restart {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Memory: Situation & Vermutung</h2>
        <p>Klicke auf die Karten. Der Text ist <b>linksbündig</b> ausgerichtet. Gefundene Paare verschwinden langsam.</p>
    </div>

    <div id="grid" class="memory-grid"></div>

    <div id="feedback"></div>

    <div class="controls">
        <button class="btn-restart" onclick="resetGame()">Spiel Neustarten</button>
    </div>

    <script>
        const pairs = [
            { de: "Dein Freund hat kein Geld dabei.", ru: "Что, денег нет?" },
            { de: "Jemand zittert vor Kälte.", ru: "Что, холодно?" },
            { de: "Jemand gähnt laut.", ru: "Что, устал?" },
            { de: "Jemand hält sich den Bauch.", ru: "Что, хочешь есть?" },
            { de: "Jemand schwitzt stark.", ru: "Что, жарко?" },
            { de: "Jemand arbeitet konzentriert.", ru: "Что, работаешь?" }
        ];

        let flippedCards = [];
        let matchedCount = 0;
        let isLocking = false;

        function initGame() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            isLocking = false;
            document.getElementById('feedback').textContent = '';

            let cardData = [];
            pairs.forEach((p, index) => {
                cardData.push({ text: p.de, pairId: index });
                cardData.push({ text: p.ru, pairId: index });
            });

            cardData.sort(() => Math.random() - 0.5);

            cardData.forEach((data) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.pairId = data.pairId;
                card.textContent = data.text;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isLocking) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                isLocking = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                document.getElementById('feedback').textContent = "Richtig! ✓";
                document.getElementById('feedback').style.color = "var(--success)";
                
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount++;
                    flippedCards = [];
                    isLocking = false;
                    
                    if (matchedCount === pairs.length) {
                        document.getElementById('feedback').textContent = "Hervorragend! Alles gefunden.";
                    }
                }, 800);
            } else {
                document.getElementById('feedback').textContent = "Nicht korrekt ✗";
                document.getElementById('feedback').style.color = "var(--error)";
                
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocking = false;
                    document.getElementById('feedback').textContent = "";
                }, 1200);
            }
        }

        function resetGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
