<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch Hotspot-Training: 6 Situationen</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; max-width: 800px; margin-bottom: 20px; }

        .game-wrapper {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .image-container {
            position: relative;
            width: 100%;
            line-height: 0;
            overflow: hidden;
            border-radius: 10px;
        }

        .main-img {
            width: 100%;
            height: auto;
            transition: opacity 0.3s;
        }

        .hotspot {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(52, 152, 219, 0.7);
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            animation: pulse 2s infinite;
            z-index: 5;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70% { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 0 15px rgba(255,255,255,0); }
            100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.92);
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .bubble-btn {
            background: white;
            border: 2px solid var(--accent-color);
            padding: 12px 20px;
            margin: 8px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            width: 100%;
            max-width: 300px;
            transition: 0.2s;
        }

        .bubble-btn:hover:not(:disabled) { background: var(--accent-color); color: white; }

        .nav-controls {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        #restart-btn {
            background-color: #7f8c8d;
        }

        #restart-btn:hover {
            background-color: #34495e;
        }

        #feedback { font-weight: bold; margin: 15px 0; min-height: 24px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Hotspot-Suche: Vermutungen mit "что"</h2>
        <p>Finde den pulsierenden Punkt in jedem Bild und wähle die passende russische Vermutung.</p>
    </div>

    <div class="game-wrapper">
        <div class="image-container">
            <img id="display-img" src="" alt="Situation" class="main-img">
            <div id="active-hotspot" class="hotspot" onclick="showChoices()"></div>
            
            <div id="choices-overlay" class="overlay">
                <h3 id="question-title">Was vermutest du hier?</h3>
                <div id="options-container"></div>
                <div id="feedback"></div>
                <button class="nav-btn" onclick="closeOverlay()">Zurück zum Bild</button>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button id="prev-btn" class="nav-btn" onclick="changeSlide(-1)">Zurück</button>
        <span id="slide-info">Bild 1 / 6</span>
        <button id="next-btn" class="nav-btn" onclick="changeSlide(1)">Weiter</button>
        <button id="restart-btn" class="nav-btn" onclick="restartGame()">Neustart</button>
    </div>

    <script>
        const scenarios = [
            { img: "Hitze.jpg", x: "55%", y: "40%", correct: "Что, жарко?", wrong: "Что, холодно?" },
            { img: "Kälte.jpg", x: "60%", y: "45%", correct: "Что, холодно?", wrong: "Что, устала?" },
            { img: "Müde.jpg", x: "52%", y: "48%", correct: "Что, устала?", wrong: "Что, работаешь?" },
            { img: "bedrückt.jpg", x: "48%", y: "45%", correct: "Что, грустно?", wrong: "Что, жарко?" },
            { img: "Magenknurren.jpg", x: "50%", y: "75%", correct: "Что, хочешь есть?", wrong: "Что, работаешь?" },
            { img: "konzentriert.jpg", x: "50%", y: "40%", correct: "Что, работаешь?", wrong: "Что, опаздываешь?" }
        ];

        let currentIdx = 0;

        function initSlide() {
            const s = scenarios[currentIdx];
            document.getElementById('display-img').src = s.img;
            const hs = document.getElementById('active-hotspot');
            hs.style.left = s.x;
            hs.style.top = s.y;
            document.getElementById('slide-info').textContent = `Bild ${currentIdx + 1} / ${scenarios.length}`;
            
            document.getElementById('prev-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').disabled = currentIdx === scenarios.length - 1;
            
            closeOverlay();
        }

        function showChoices() {
            const s = scenarios[currentIdx];
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('feedback').textContent = '';
            
            const options = [s.correct, s.wrong].sort(() => Math.random() - 0.5);
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bubble-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === s.correct, btn);
                container.appendChild(btn);
            });
            
            document.getElementById('choices-overlay').style.display = 'flex';
        }

        function checkAnswer(isCorrect, btn) {
            const feedback = document.getElementById('feedback');
            const btns = document.querySelectorAll('.bubble-btn');
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                feedback.textContent = "Richtig! ✓";
                feedback.style.color = "var(--success-color)";
                btn.style.background = "var(--success-color)";
                btn.style.color = "white";
                btn.style.borderColor = "var(--success-color)";
            } else {
                feedback.textContent = "Nicht ganz. ✗";
                feedback.style.color = "var(--error-color)";
                btn.style.background = "var(--error-color)";
                btn.style.color = "white";
                btn.style.borderColor = "var(--error-color)";
            }
        }

        function closeOverlay() {
            document.getElementById('choices-overlay').style.display = 'none';
        }

        function changeSlide(dir) {
            currentIdx += dir;
            initSlide();
        }

        function restartGame() {
            currentIdx = 0;
            initSlide();
        }

        window.onload = initSlide;
    </script>
</body>
</html>
